# Copy to ~/.aster.yaml or set ASTER_CONFIG=/path/to/file.yaml
#
# Mainnet HMAC
aster_api_key: "YOUR_MAINNET_API_KEY"
aster_api_secret: "YOUR_MAINNET_API_SECRET"
aster_base_url: "https://fapi.asterdex.com"
aster_auth_mode: "hmac"

# Optional agent auth fields
# aster_user: "0x..."
# aster_signer: "0x..."
# aster_private_key: "0x..."
# aster_chain_id: 1666

# Optional telegram keys used by cmd/live
telegram_bot_token: "123456:ABCDEF..."
telegram_chat_id: "123456789"
