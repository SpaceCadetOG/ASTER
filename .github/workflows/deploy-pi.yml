name: deploy-pi

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Deploy to Pi
        run: |
          bash scripts/deploy_pi.sh

      - name: Restart services
        run: |
          sudo systemctl restart aster-modules-tmux || true
          sudo systemctl restart aster-autoupdate.timer || true

      - name: Status
        run: |
          systemctl --no-pager --full status aster-modules-tmux || true
          systemctl --no-pager --full status aster-autoupdate.timer || true
          tmux ls || true
