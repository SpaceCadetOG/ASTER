name: deploy-pi

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Build host artifacts
        run: |
          bash scripts/deploy_pi.sh

      - name: Orchestration removed
        run: |
          echo "Legacy Pi tmux/systemd orchestration was removed from the repo."

      - name: Status
        run: |
          echo "No repo-managed runtime supervisor remains in this workflow."
