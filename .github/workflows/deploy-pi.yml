name: deploy-pi

on:
  push:
    branches: ["main"]

jobs:
  build_test_deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Go test
        run: |
          go test ./...

      - name: Build binaries
        run: |
          mkdir -p /opt/aster/bin
          go build -o /opt/aster/bin/long  ./cmd/long
          go build -o /opt/aster/bin/short ./cmd/short
          # optional:
          # go build -o /opt/aster/bin/rr ./cmd/rr

      - name: Restart services
        run: |
          sudo systemctl restart aster-long
          sudo systemctl restart aster-short

      - name: Status
        run: |
          systemctl --no-pager --full status aster-long || true
          systemctl --no-pager --full status aster-short || true